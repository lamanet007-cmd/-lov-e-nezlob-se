<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Člověče, nezlob se – pro 3 hráče</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--pc:#ff3fa4;--pink:#ff3fa4;--aqua:#1fe0d0;--ink:#fff4fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
background:radial-gradient(circle at 50% -10%,#5a1a8c 0,transparent 55%),radial-gradient(circle at 50% 120%,#7a0f54,transparent 55%),radial-gradient(#ff3fa41c 2px,transparent 3px) 0 0/30px 30px,#0d0716;
display:flex;flex-direction:column;align-items:center;padding:12px 12px 22px;gap:10px}
.logo{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:clamp(1.7rem,5vw,2.9rem);margin:0;color:var(--pink);letter-spacing:1px;text-align:center;
-webkit-text-stroke:2px #1a0430;paint-order:stroke fill;text-shadow:0 4px 0 #1a0430,0 0 26px #ff3fa4bb}
.logo small{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.34em;letter-spacing:.4em;color:var(--aqua);text-shadow:0 0 12px var(--aqua);-webkit-text-stroke:0;margin-top:4px}
main{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start;width:100%;max-width:1000px}
#stage{width:min(94vw,78vh,720px);aspect-ratio:1;border-radius:28px;overflow:hidden;box-shadow:0 0 0 3px var(--pink),0 0 40px #ff3fa488,0 18px 40px #000a;touch-action:none;cursor:grab;background:#0d0716}
#stage canvas{display:block;width:100%!important;height:100%!important}
#side{display:flex;flex-direction:column;gap:12px;width:min(94vw,280px)}
.card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:#1a0b2acc;border:2px solid #ffffff18;transition:.25s;margin-bottom:8px}
.card.on{background:#2b1244;border-color:var(--c);box-shadow:0 0 0 2px #0006,0 0 24px var(--c)}
.dot img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.dot{width:44px;height:44px;overflow:hidden;border:3px solid var(--c);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--c) 55%,#0006);flex:none}
.card b{flex:1;font-weight:800}
.pips{display:flex;gap:4px}
.pips i{width:11px;height:11px;border-radius:50%;background:#ffffff26}
.pips i.f{background:var(--c);box-shadow:0 0 8px var(--c)}
#diceWrap{display:flex;flex-direction:column;align-items:center;gap:10px}
#msg{min-height:3.2em;font-weight:800;text-align:center;line-height:1.25;padding:0 6px}
#btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#dice{width:84px;height:84px;perspective:600px;cursor:pointer;margin:8px 0 12px;filter:drop-shadow(0 0 14px var(--pc))}
#dice.roll{animation:hopd 1s ease-in-out}
@keyframes hopd{40%{transform:translateY(-36px) scale(1.18)}}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.f{position:absolute;inset:0;border-radius:16px;padding:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);background:linear-gradient(145deg,#3a1560,#14061f);border:3px solid var(--pc);backface-visibility:hidden;box-shadow:inset 0 0 16px #ff3fa455}
.f span{width:72%;height:72%;margin:auto;border-radius:50%;opacity:0;background:radial-gradient(circle at 35% 30%,#fff,#ff7cc4 45%,#ff3fa4);box-shadow:0 0 8px #ff3fa4}
.f span.o{opacity:1}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;color:#fff;
background:linear-gradient(#ff6cbc,#e0148a);box-shadow:0 4px 0 #7a0a4c,0 0 18px #ff3fa488;text-shadow:0 1px 0 #7a0a4c;transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a0a4c}
button:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
button.ghost{background:#ffffff12;box-shadow:none;text-shadow:none;border:2px solid #ff3fa4aa;padding:9px 16px}
#menu,#win{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px 14px;overflow:auto;background:radial-gradient(circle at 50% 0,#4b1578ee,#0d0716f2 70%);backdrop-filter:blur(8px)}
#menu{justify-content:flex-start}
#menu.show,#win.show{display:flex}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:min(100%,900px)}
.vc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:24px;background:linear-gradient(160deg,#2a0f45,#150822);border:2px solid #ff3fa466;color:var(--ink);box-shadow:0 6px 0 #0007;text-shadow:none;transition:.2s}
.vc:hover{transform:translateY(-4px) scale(1.03);border-color:var(--aqua);box-shadow:0 0 28px #1fe0d088}
.vc.on{border-color:var(--pink);box-shadow:0 0 22px #ff3fa488}
.vc svg{width:116px;height:116px;border-radius:16px;background:radial-gradient(#3a1062,#12051c)}
.vc b{font-size:1.08rem}.vc small{opacity:.78;font-weight:600;font-size:.82rem;text-align:center}
.hint{opacity:.6;font-size:.8rem;text-align:center;margin:0;max-width:520px}
#win h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:2.6rem;margin:0;color:var(--pc);text-shadow:0 0 24px var(--pc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1 class="logo">Člověče, nezlob se<small>GHOUL EDITION</small></h1>
<main>
<div id="stage" aria-label="3D herní plán"></div>
<div id="side">
<div id="players"></div>
<div id="diceWrap">
<div id="dice" role="button" aria-label="Kostka" tabindex="0"><div class="cube" id="cube"></div></div>
<button id="rollBtn">Hodit kostkou</button>
<div id="msg"></div>
<div id="btns"><button class="ghost" id="menuBtn">☰ Menu</button><button class="ghost" id="newBtn">↻ Znovu</button></div>
</div>
</div>
</main>
<div id="menu">
<h1 class="logo">Člověče, nezlob se<small>VYBER SI VERZI HRY</small></h1>
<div id="cards"></div>
<button id="closeMenu" style="display:none">▶ Zpět do hry</button>
<p class="hint">Hrají 3 hráči na jednom zařízení. Ve hře: tažením otáčíš kamerou, kolečkem přibližuješ, dvojklik vrátí pohled.</p>
</div>
<div id="win"><div style="font-size:4.5rem">🏆</div><h2 id="winTxt"></h2><div id="btns"><button id="again">Hrát znovu</button><button class="ghost" id="toMenu">Menu</button></div></div>
<script>

const U=60,C=330,NS='http://www.w3.org/2000/svg';
const COL=['#ff3fa4','#1fe0d0','#ff9a2e'],LT=['#ffa6d6','#9ff5ee','#ffd29a'],DK=['#a3105f','#0a7f77','#b35a00'];
const NAMES=['Upírka','Sešitá','Vlkodlačka'];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TR0=[[4,0],[4,1],[4,2],[4,3],[4,4],[3,4],[2,4],[1,4],[0,4],[0,5],[0,6],[1,6],[2,6],[3,6],[4,6],[4,7],[4,8],[4,9],[4,10],[5,10],[6,10],[6,9],[6,8],[6,7],[6,6],[7,6],[8,6],[9,6],[10,6],[10,5],[10,4],[9,4],[8,4],[7,4],[6,4],[6,3],[6,2],[6,1],[6,0],[5,0]];
const LN0=[[[5,1],[5,2],[5,3],[5,4]],[[1,5],[2,5],[3,5],[4,5]],[[5,9],[5,8],[5,7],[5,6]]];

/* ---------- Rozložení desek ---------- */
const rot=(x,y,a,s)=>{const t=a*Math.PI/180,X=x-C,Y=y-C;return [C+s*(X*Math.cos(t)-Y*Math.sin(t)),C+s*(X*Math.sin(t)+Y*Math.cos(t))]};
function classic(name,a,s){
 const cell=([r,c])=>rot((c+.5)*U,(r+.5)*U,a,s);
 const org=[[0,0],[0,7],[7,7]];
 return {name,cr:24*s,sr:25*s,starts:[0,10,20],track:TR0.map(cell),lanes:LN0.map(l=>l.map(cell)),
  bases:org.map(([r,c])=>[0,1,2,3].map(k=>rot((c+1+(k%2)*2)*U,(r+1+(k>>1)*2)*U,a,s))),
  panels:[[0,0,0],[0,7,1],[7,7,2],[7,0,-1]].map(([r,c,i])=>({p:rot((c+2)*U,(r+2)*U,a,s),w:212*s,i,a})),
  center:`<g transform="translate(330 330) rotate(${a}) scale(${s})"><rect x="-44" y="-44" width="88" height="88" rx="12" fill="#2a170b" stroke="#e8c27a" stroke-width="3"/>
  <path d="M0 0L-38-38V38Z" fill="${COL[0]}"/><path d="M0 0L-38-38H38Z" fill="${COL[1]}"/><path d="M0 0L38-38V38Z" fill="${COL[2]}"/><path d="M0 0L-38 38H38Z" fill="#777" opacity=".45"/>
  <circle r="12" fill="#ffd980" stroke="#7a4a10" stroke-width="3"/></g>`};
}
function finish(name,track,cr,pc,off,sr){
 const N=track.length,starts=[0,N/4,N/2];
 const ent=starts.map(s=>track[(s-1+N)%N]);
 const lanes=ent.map(e=>[1,2,3,4].map(k=>[e[0]+(C-e[0])*k/5.3,e[1]+(C-e[1])*k/5.3]));
 const cs=[[pc,pc],[660-pc,pc],[660-pc,660-pc]];
 const w=2*(pc-14);
 let center=`<circle cx="330" cy="330" r="40" fill="#2a170b" stroke="#e8c27a" stroke-width="3"/>`;
 ent.forEach((e,i)=>{const g=Math.atan2(e[1]-C,e[0]-C),f=q=>`${C+36*Math.cos(q)} ${C+36*Math.sin(q)}`;
  center+=`<path d="M330 330L${f(g-Math.PI/4)}A36 36 0 0 1 ${f(g+Math.PI/4)}Z" fill="${COL[i]}"/>`});
 center+=`<circle cx="330" cy="330" r="11" fill="#ffd980" stroke="#7a4a10" stroke-width="3"/>`;
 return {name,cr,sr,starts,track,lanes,center,
  bases:cs.map(([x,y])=>[[-off,-off],[off,-off],[-off,off],[off,off]].map(([a,b])=>[x+a,y+b])),
  panels:[...cs.map((p,i)=>({p,w,i,a:0})),{p:[pc,660-pc],w,i:-1,a:0}]};
}
function polar(name,N,rf,cr){
 return finish(name,[...Array(N)].map((_,i)=>{const t=(-135+i*360/N)*Math.PI/180,r=rf(t);return [C+r*Math.cos(t),C+r*Math.sin(t)]}),cr,78,24,18)}
const sq=[];for(let i=0;i<32;i++){const d=i>>3,t=140+(i%8)*47.5;sq.push([[t,140],[520,t],[660-t,520],[140,660-t]][d])}
const LAYOUTS=[
 classic('Hřbitov',0,1),
 classic('Netopýří kříž',45,.66),
 polar('Kouzelný kruh',36,()=>205,15),
 polar('Hvězda strachu',32,t=>200+30*Math.cos(4*(t+3*Math.PI/4)),14),
 finish('Katakomby',sq,17,70,20,15)
];
let lay=0;try{lay=+localStorage.getItem('cnsLay')||0}catch(e){}
if(!LAYOUTS[lay])lay=0;
const DESC=['Původní kříž, 40 polí','Stejný kříž, ale šikmo','Hladký kruh, 36 polí','Cesta ve tvaru hvězdy','Čtvercový okruh, starty v rozích'];
let LAY,N,pos,turn,phase,busy,tries,cur=[],els=[];
const S=30,W=p=>new THREE.Vector3((p[0]-330)/S,0,(p[1]-330)/S);
let bats=[],started=false,renderer,scene,camera,boardMat,pg,flash,ptcl=[],shake=0,az=0,pol=.85,rad=38;
const anim=(d,f)=>new Promise(res=>{const t0=performance.now();(function s(n){const t=Math.min(1,(n-t0)/(d*1000));f(t);t<1?requestAnimationFrame(s):res()})(t0)});
const canv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c};

function initGL(){
 const st=$('stage');
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
 st.appendChild(renderer.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color('#150f26');
 camera=new THREE.PerspectiveCamera(38,1,.1,300);
 // prostředí pro lesk
 const es=new THREE.Scene();
 const gt=new THREE.CanvasTexture(canv(4,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#e9b8ff');g.addColorStop(.5,'#6a2f9e');g.addColorStop(1,'#1a0830');x.fillStyle=g;x.fillRect(0,0,w,h)}));
 es.add(new THREE.Mesh(new THREE.SphereGeometry(60,32,16),new THREE.MeshBasicMaterial({map:gt,side:THREE.BackSide})));
 [[0,24,0,16,.4,10],[-26,10,12,.4,8,14],[26,8,-10,.4,8,12]].forEach(([x,y,z,a,b,c])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),new THREE.MeshBasicMaterial({color:new THREE.Color(6,6,6)}));m.position.set(x,y,z);es.add(m)});
 scene.environment=new THREE.PMREMGenerator(renderer).fromScene(es,.03).texture;
 // světla
 scene.add(new THREE.HemisphereLight(0xe3c8ff,0x3a1060,.6));
 const sun=new THREE.DirectionalLight(0xfff0d8,1.7);sun.position.set(-12,26,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
 const q=sun.shadow.camera;q.left=q.bottom=-17;q.right=q.top=17;q.near=5;q.far=70;sun.shadow.bias=-.0004;sun.shadow.radius=3;scene.add(sun);
 flash=new THREE.PointLight(0xffc060,0,16,2);scene.add(flash);
 // stůl
 const tt=new THREE.CanvasTexture(canv(1024,1024,(x,w,h)=>{const g=x.createRadialGradient(w/2,h/2,20,w/2,h/2,w*.62);g.addColorStop(0,'#4a1a7a');g.addColorStop(.55,'#24093f');g.addColorStop(1,'#0d0716');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,63,164,.16)';for(let i=0;i<w;i+=64)for(let j=0;j<h;j+=64){x.beginPath();x.arc(i+((j/64)%2)*32,j,7,0,7);x.fill()}}));
 tt.encoding=THREE.sRGBEncoding;
 const table=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({map:tt,roughness:.6,metalness:.1}));
 table.rotation.x=-Math.PI/2;table.position.y=-1.5;table.receiveShadow=true;scene.add(table);
 // deska
 const dark=new THREE.MeshPhysicalMaterial({color:0x14081f,roughness:.35,clearcoat:1,clearcoatRoughness:.15});
 boardMat=new THREE.MeshStandardMaterial({color:0x333333,roughness:.4,metalness:.1,envMapIntensity:.8});
 const slab=new THREE.Mesh(new THREE.BoxGeometry(22,1.2,22),[dark,dark,boardMat,dark,dark,dark]);
 slab.position.y=-.6;slab.castShadow=slab.receiveShadow=true;scene.add(slab);
 const neon=new THREE.MeshStandardMaterial({color:0xff3fa4,emissive:0xff3fa4,emissiveIntensity:1.6,roughness:.3});
 const trim=new THREE.Mesh(new THREE.BoxGeometry(22.5,.35,22.5),neon);trim.position.y=-1;scene.add(trim);
 const p1=new THREE.PointLight(0xff3fa4,1.1,60,1.4);p1.position.set(-16,7,-12);const p2=new THREE.PointLight(0x1fe0d0,1,60,1.4);p2.position.set(16,7,14);scene.add(p1,p2);
 // netopýři
 const wing=new THREE.Shape();wing.moveTo(0,.25);wing.quadraticCurveTo(.4,.7,.9,.45);wing.quadraticCurveTo(1.7,.9,2.4,0);wing.quadraticCurveTo(1.9,.1,1.6,-.5);wing.quadraticCurveTo(1.2,-.1,.9,-.6);wing.quadraticCurveTo(.5,-.1,0,-.55);
 const wg=new THREE.ShapeGeometry(wing),bm=new THREE.MeshBasicMaterial({color:0x07020d,side:THREE.DoubleSide});
 bats=[...Array(7)].map((_,i)=>{const b=new THREE.Group(),R=new THREE.Group(),L=new THREE.Group();R.add(new THREE.Mesh(wg,bm));const lm=new THREE.Mesh(wg,bm);lm.scale.x=-1;L.add(lm);
  b.add(R,L,new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),bm));b.userData={R,L,a:i*.9,r:36+(i%3)*5,h:15+(i%4)*2,s:.15+.04*i};b.scale.setScalar(1.6);scene.add(b);return b});
 // ovládání kamery
 let drag=null;const rc=new THREE.Raycaster();
 st.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,m:0};st.setPointerCapture(e.pointerId)});
 st.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;az-=dx*.006;pol=Math.min(1.35,Math.max(.2,pol-dy*.005))});
 st.addEventListener('pointerup',e=>{if(drag&&drag.m<6){const r=st.getBoundingClientRect();
  rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1)),camera);
  const h=rc.intersectObjects(pg.children,true)[0];if(h){let o=h.object;while(o&&o.userData.pl===undefined)o=o.parent;if(o)pick(o.userData.pl,o.userData.k)}}drag=null});
 st.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(55,Math.max(22,rad*(1+e.deltaY*.001)))},{passive:false});
 st.addEventListener('dblclick',()=>{az=0;pol=.85;rad=38});
 new ResizeObserver(()=>{const w=st.clientWidth,h=st.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe(st);
 let last=performance.now();
 renderer.setAnimationLoop(n=>{const dt=Math.min(.05,(n-last)/1000);last=n;const t=n/1000;
  els.forEach(a=>a.forEach(o=>{const u=o.userData;
   if(u.can){u.pivot.position.y=.2+.18*Math.sin(t*7);u.ring.rotation.z=t*2;u.ring.material.opacity=.6+.4*Math.sin(t*6)}
   else if(!u.busy){u.pivot.scale.y=1+.02*Math.sin(t*2+u.k)}}));
  for(let i=ptcl.length-1;i>=0;i--){const p=ptcl[i];p.v.y-=14*dt;p.m.position.addScaledVector(p.v,dt);p.l-=dt*1.4;p.m.material.opacity=Math.max(0,p.l);if(p.l<=0){scene.remove(p.m);ptcl.splice(i,1)}}
  flash.intensity*=.88;shake*=.9;
  bats.forEach(b=>{const u=b.userData;u.a+=u.s*dt;b.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(t*1.3+u.a*3),Math.sin(u.a)*u.r);b.rotation.y=-u.a;const f=Math.sin(t*9+u.a*5)*.7;u.R.rotation.z=f;u.L.rotation.z=-f});
  const sp=Math.sin(pol);camera.position.set(rad*sp*Math.sin(az)+(Math.random()-.5)*shake,rad*Math.cos(pol)+(Math.random()-.5)*shake,rad*sp*Math.cos(az));
  camera.lookAt(0,0,0);renderer.render(scene,camera)});
}

/* ---------- Textura desky (SVG -> canvas) ---------- */
const skull=(x,y,r,c='#fff',bow=true)=>`<g transform="translate(${x} ${y}) scale(${r/20})"><ellipse cy="-2" rx="16" ry="15" fill="${c}"/><rect x="-9" y="8" width="18" height="10" rx="3" fill="${c}"/><ellipse cx="-6" cy="0" rx="4.5" ry="5.5" fill="#1a0a2a"/><ellipse cx="6" cy="0" rx="4.5" ry="5.5" fill="#1a0a2a"/><path d="M0 6l-2.5 4.5h5z" fill="#1a0a2a"/><path d="M-4 13v4M0 13v4M4 13v4" stroke="#1a0a2a" stroke-width="1.6"/>${bow?'<path d="M10-15l13-8v16zM10-15l-10-8v16z" fill="#ff3fa4" stroke="#7a0a4c" stroke-width="1"/><circle cx="10" cy="-15" r="3.6" fill="#ff8ccd"/>':''}</g>`;
const web=(x,y,sx,sy)=>{let s='';const P=(d,k)=>[x+sx*d*Math.cos(k*Math.PI/8),y+sy*d*Math.sin(k*Math.PI/8)];
 for(let k=0;k<=4;k++){const p=P(230,k);s+=`M${x} ${y}L${p[0]} ${p[1]}`}
 for(let r=1;r<=5;r++){const q=[0,1,2,3,4].map(k=>P(r*44,k));s+=`M${q[0][0]} ${q[0][1]}`;
  for(let i=1;i<5;i++){const m=[(q[i-1][0]+q[i][0])/2,(q[i-1][1]+q[i][1])/2];s+=`Q${x+(m[0]-x)*.8} ${y+(m[1]-y)*.8} ${q[i][0]} ${q[i][1]}`}}
 return `<path d="${s}" stroke="#ffffff26" stroke-width="1.5" fill="none"/>`};
function drawBoard(){
 let s=`<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 660 660"><defs>
 <radialGradient id="bg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#4a1578"/><stop offset=".7" stop-color="#220a3a"/><stop offset="1" stop-color="#12051c"/></radialGradient>
 <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3.2" fill="#ff3fa4" opacity=".16"/><circle cx="22" cy="22" r="3.2" fill="#ff3fa4" opacity=".16"/></pattern>
 <pattern id="pd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#fff" opacity=".24"/><circle cx="17" cy="17" r="3" fill="#fff" opacity=".24"/></pattern>
 <radialGradient id="hole" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#3d1a60"/><stop offset="1" stop-color="#0a0314"/></radialGradient>
 <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
 <radialGradient id="gl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>`;
 for(let i=0;i<3;i++)s+=`<radialGradient id="g${i}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${LT[i]}"/><stop offset=".5" stop-color="${COL[i]}"/><stop offset="1" stop-color="${DK[i]}"/></radialGradient>`;
 s+=`</defs><rect width="660" height="660" fill="url(#bg)"/><rect width="660" height="660" fill="url(#dots)"/>`;
 s+=web(18,18,1,1)+web(642,18,-1,1)+web(18,642,1,-1)+web(642,642,-1,-1);
 for(let i=0;i<50;i++)s+=`<circle cx="${(i*137.5)%640+10}" cy="${(i*89.3)%640+10}" r="${1+(i%3)*.5}" fill="#fff" opacity=".45"/>`;
 s+=`<rect x="10" y="10" width="640" height="640" rx="30" fill="none" stroke="#ff3fa4" stroke-width="9" filter="url(#blur)"/><rect x="10" y="10" width="640" height="640" rx="30" fill="none" stroke="#ffd1ec" stroke-width="3"/>`;
 const cr=LAY.cr,pts=LAY.track.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
 s+=`<polygon points="${pts}" fill="none" stroke="#12051f" stroke-width="${cr*1.8}" stroke-linejoin="round" opacity=".85"/><polygon points="${pts}" fill="none" stroke="#ff3fa4" stroke-width="3.5" stroke-dasharray="1 9" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
 for(const {p,w,i,a} of LAY.panels){
  const r=`x="${p[0]-w/2}" y="${p[1]-w/2}" width="${w}" height="${w}" rx="${w*.16}" transform="rotate(${a} ${p[0]} ${p[1]})"`;
  if(i<0){s+=`<rect ${r} fill="#fff" opacity=".07"/><g opacity=".2">${skull(p[0],p[1],w*.22)}</g>`;continue}
  s+=`<rect ${r} fill="none" stroke="${COL[i]}" stroke-width="10" filter="url(#blur)"/><rect ${r} fill="${COL[i]}" opacity=".95"/><rect ${r} fill="url(#pd)"/><rect ${r} fill="url(#felt)"/><rect ${r} fill="none" stroke="#fff" stroke-width="3"/>`;
  s+=`<text x="${p[0]}" y="${p[1]-w/2+Math.max(15,w*.1)}" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="${Math.max(13,w*.075)}" fill="#fff" stroke="#1a0430" stroke-width="3.5" paint-order="stroke" letter-spacing="1.5" transform="rotate(${a} ${p[0]} ${p[1]})">${NAMES[i].toUpperCase()}</text>`;
  LAY.bases[i].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="${LAY.sr}" fill="#1a0430" opacity=".75" stroke="#fff" stroke-opacity=".8" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${LAY.sr*.55}" fill="${DK[i]}" opacity=".8"/>`)}
 LAY.track.forEach(([x,y],n)=>{const si=LAY.starts.indexOf(n);
  s+=`<circle cx="${x}" cy="${y}" r="${cr}" fill="none" stroke="${si>=0?COL[si]:'#b78cff'}" stroke-width="7" filter="url(#blur)" opacity=".8"/>`;
  s+=`<circle cx="${x}" cy="${y+1.5}" r="${cr+2}" fill="#0006"/><circle cx="${x}" cy="${y}" r="${cr}" fill="${si>=0?`url(#g${si})`:'url(#hole)'}" stroke="${si>=0?'#fff':'#c9a8ff'}" stroke-width="3"/>`;
  s+=si>=0?skull(x,y+1,cr*.62,'#fff',false)+`<circle cx="${x}" cy="${y}" r="${cr}" fill="url(#gl)" opacity=".5"/>`:`<path d="M${x-cr*.55} ${y+cr*.45}A${cr*.72} ${cr*.72} 0 0 0 ${x+cr*.55} ${y+cr*.45}" stroke="#fff3" stroke-width="2" fill="none"/>`});
 LAY.lanes.forEach((l,i)=>l.forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="${cr-2}" fill="${COL[i]}" opacity=".35" filter="url(#blur)"/><circle cx="${x}" cy="${y}" r="${cr-2}" fill="url(#hole)" stroke="${COL[i]}" stroke-width="${Math.max(3,cr/4)}"/><circle cx="${x}" cy="${y}" r="${cr*.4}" fill="${COL[i]}" opacity=".7"/>`));
 s+=LAY.center+`<circle cx="330" cy="330" r="44" fill="none" stroke="#ff3fa4" stroke-width="4"/>`+skull(330,334,27);
 return s+'</svg>';
}
function loadBoardTex(svg){
 const img=new Image();img.onload=()=>{const c=canv(2048,2048,x=>x.drawImage(img,0,0,2048,2048));
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  boardMat.map=t;boardMat.color.set(0xffffff);boardMat.needsUpdate=true};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}

/* ---------- 3D příšerky ---------- */
const CH=[{skin:'#f8e8f0',h1:'#150a1e',h2:'#ff3fa4',iris:'#ff3fa4'},{skin:'#bdf0df',h1:'#150a1e',h2:'#f6f6ff',iris:'#8a3cff'},{skin:'#d9a27a',h1:'#5a2f14',h2:'#ff9a2e',iris:'#3a2208'}];
function makePieces(){
 if(pg)scene.remove(pg);pg=new THREE.Group();scene.add(pg);els=[];
 const ks=LAY.cr/30,E=THREE,PI=Math.PI;
 const G={dress:new E.LatheGeometry([[0,0],[.7,0],[.74,.07],[.62,.35],[.44,.7],[.3,1],[.26,1.2],[0,1.2]].map(p=>new E.Vector2(...p)),40),
  head:new E.SphereGeometry(.46,32,24),cap:new E.SphereGeometry(.5,32,24,0,PI*2,0,PI*.42),streak:new E.SphereGeometry(.515,32,24,.2,1.1,0,PI*.4),
  pig:new E.SphereGeometry(.17,16,12),eye:new E.SphereGeometry(.12,16,12),iris:new E.SphereGeometry(.085,12,10),pup:new E.SphereGeometry(.045,8,6),hl:new E.SphereGeometry(.025,6,5),
  fist:new E.SphereGeometry(.19,16,12),hem:new E.TorusGeometry(.72,.05,8,40),belt:new E.TorusGeometry(.31,.04,8,32),neck:new E.CylinderGeometry(.1,.12,.2,12),
  cone:new E.ConeGeometry(.16,.4,12),lash:new E.BoxGeometry(.17,.03,.03),mouth:new E.SphereGeometry(.05,10,8),fang:new E.ConeGeometry(.025,.07,6),bolt:new E.CylinderGeometry(.04,.04,.24,8),ringG:new E.TorusGeometry(.95,.05,8,48)};
 const blk=new E.MeshPhysicalMaterial({color:0x120618,roughness:.25,clearcoat:1}),wht=new E.MeshStandardMaterial({color:0xffffff,roughness:.15}),dk=new E.MeshStandardMaterial({color:0x080308,roughness:.3}),
  lip=new E.MeshStandardMaterial({color:0xb01060,roughness:.4}),steel=new E.MeshStandardMaterial({color:0xaab0b8,metalness:1,roughness:.25});
 for(let pl=0;pl<3;pl++){els[pl]=[];const c=CH[pl];
  const mDress=new E.MeshPhysicalMaterial({color:COL[pl],roughness:.28,clearcoat:1,clearcoatRoughness:.1,envMapIntensity:1.1}),
   mSkin=new E.MeshStandardMaterial({color:c.skin,roughness:.5}),
   mH1=new E.MeshPhysicalMaterial({color:c.h1,roughness:.3,clearcoat:.6}),mH2=new E.MeshPhysicalMaterial({color:c.h2,roughness:.3,clearcoat:.6}),
   mIris=new E.MeshStandardMaterial({color:c.iris,roughness:.2,emissive:c.iris,emissiveIntensity:.25});
  for(let k=0;k<4;k++){
   const root=new E.Group(),pv=new E.Group();pv.rotation.order='YXZ';
   const add=(g,m,x,y,z,sx=1,sy=1,sz=1)=>{const o=new E.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;pv.add(o);return o};
   add(G.dress,mDress,0,0,0);add(G.hem,blk,0,.07,0).rotation.x=PI/2;add(G.belt,blk,0,.98,0).rotation.x=PI/2;
   add(G.neck,mSkin,0,1.28,0);add(G.head,mSkin,0,1.75,0,1,1.05,1);
   const cap=add(G.cap,mH1,0,1.78,-.04);cap.rotation.x=-.35;const st=add(G.streak,mH2,0,1.78,-.04);st.rotation.x=-.35;
   add(G.pig,mH1,-.5,1.7,-.1,1,1.9,1);add(G.pig,mH2,.5,1.7,-.1,1,1.9,1);
   [-1,1].forEach(sd=>{add(G.eye,wht,sd*.17,1.76,.36,1,1.35,.55);add(G.iris,mIris,sd*.17,1.76,.43,1,1.3,.6);add(G.pup,dk,sd*.17,1.76,.465,1,1.3,.6);add(G.hl,wht,sd*.17+.03,1.8,.485);
    add(G.lash,dk,sd*.21,1.92,.37).rotation.z=-sd*.4});
   add(G.mouth,lip,0,1.58,.43,1.7,.7,.7);
   if(pl===0){[-1,1].forEach(sd=>{add(G.fang,wht,sd*.045,1.545,.44).rotation.x=PI;
    const b=add(G.cone,mDress,sd*.17,2.2,.04);b.rotation.z=sd*PI/2});add(G.fist,mDress,0,2.2,.05,.9,.9,.9)}
   if(pl===1)[-1,1].forEach(sd=>{add(G.bolt,steel,sd*.17,1.3,0).rotation.z=PI/2});
   if(pl===2)[-1,1].forEach(sd=>{const e=add(G.cone,sd<0?mH1:mH2,sd*.32,2.15,-.04);e.rotation.z=-sd*.4});
   const fl=add(G.fist,mSkin,-.55,1,.15),fr=add(G.fist,mSkin,.55,1,.15);
   const ring=new E.Mesh(G.ringG,new E.MeshBasicMaterial({color:0xffffff,transparent:true}));ring.rotation.x=PI/2;ring.position.y=.06;ring.visible=false;
   root.add(pv,ring);root.scale.setScalar(ks);root.userData={pl,k,pivot:pv,fl,fr,ring,can:false};pg.add(root);els[pl][k]=root}}
}
const place=(pl,k)=>els[pl][k].position.copy(W(xy(pl,pos[pl][k],k)));
const setCan=(o,on)=>{o.userData.can=on;o.userData.ring.visible=on;if(!on)o.userData.pivot.position.y=0};
async function hop(o,to,h=.8,d=.2){const a=o.position.clone();o.userData.pivot.rotation.y=Math.atan2(to.x-a.x,to.z-a.z);
 await anim(d,t=>{o.position.lerpVectors(a,to,t);o.position.y=Math.sin(Math.PI*t)*h})}

/* ---------- efekty ---------- */
const spG=new THREE.SphereGeometry(.09,6,5);
function burst(p,n=18,col=0xffc23a){for(let i=0;i<n;i++){const m=new THREE.Mesh(spG,new THREE.MeshBasicMaterial({color:i%3?col:0xffffff,transparent:true}));
 m.position.copy(p).setY(1);const a=Math.random()*6.28,sp=2+Math.random()*4;
 ptcl.push({m,l:1,v:new THREE.Vector3(Math.cos(a)*sp,2+Math.random()*4,Math.sin(a)*sp)});scene.add(m)}}
function popText(p,txt){const t=new THREE.CanvasTexture(canv(256,128,x=>{x.font='900 78px Impact,"Arial Black",sans-serif';x.textAlign='center';x.lineWidth=14;x.lineJoin='round';x.strokeStyle='#5a1a00';x.fillStyle='#ffd23a';x.strokeText(txt,128,92);x.fillText(txt,128,92)}));
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));sp.position.copy(p);sp.renderOrder=9;scene.add(sp);
 anim(.8,t=>{const s=(1-Math.pow(1-Math.min(1,t*2),3))*4.4;sp.scale.set(s,s/2,1);sp.position.y=3+t*1.6;sp.material.opacity=t>.6?1-(t-.6)/.4:1}).then(()=>scene.remove(sp))}
function impact(p,big){burst(p,big?34:16,big?0xff7a1a:0xffc23a);shake=Math.max(shake,big?1.1:.45);flash.position.set(p.x,2.2,p.z);flash.intensity=big?14:7;
 if(big)popText(p,['BUM!','PRÁSK!','TŘESK!'][Math.floor(Math.random()*3)])}

/* ---------- SOUBOJ ---------- */
async function fight(a,k,v,j,prev){
 const A=els[a][k],V=els[v][j],c=A.position.clone().setY(0),ua=A.userData,uv=V.userData;
 const d=c.clone().sub(prev).setY(0);if(d.length()<.01)d.set(0,0,1);d.normalize();
 const pA=c.clone().addScaledVector(d,-.7),pV=c.clone().addScaledVector(d,.7),ang=Math.atan2(d.x,d.z);
 ua.busy=uv.busy=true;V.position.copy(c);
 ua.pivot.rotation.y=ang;uv.pivot.rotation.y=ang+Math.PI;
 await anim(.3,t=>{A.position.lerpVectors(c,pA,t);V.position.lerpVectors(c,pV,t);A.position.y=V.position.y=Math.sin(Math.PI*t)*.3});
 for(let r=0;r<3;r++){let hit=false;const fa=r%2?ua.fr:ua.fl,fv=r%2?uv.fl:uv.fr;
  await anim(.4,t=>{const s=Math.sin(Math.PI*t),o=.62*s;
   A.position.copy(pA).addScaledVector(d,o);V.position.copy(pV).addScaledVector(d,-o);
   ua.pivot.rotation.x=uv.pivot.rotation.x=.3*s;fa.position.z=fv.position.z=.15+.75*s;
   if(t>.5&&!hit){hit=true;impact(c.clone().setY(1),r===2)}});
  [ua,uv].forEach(u=>{u.pivot.rotation.x=0;u.fl.position.z=u.fr.position.z=.15})}
 const to=W(LAY.bases[v][j]);
 const fly=anim(1.1,t=>{V.position.lerpVectors(pV,to,t);V.position.y=Math.sin(Math.PI*t)*6;uv.pivot.rotation.x=t*Math.PI*6;uv.pivot.rotation.z=t*Math.PI*2});
 const cheer=anim(.9,t=>{const u=Math.min(1,t*2);A.position.lerpVectors(pA,c,u);A.position.y=Math.abs(Math.sin(Math.PI*t*2))*.7;ua.pivot.rotation.y=ang+t*Math.PI*4;
  ua.fl.position.y=ua.fr.position.y=.95+.65*Math.sin(Math.PI*u)});
 await Promise.all([fly,cheer]);
 burst(to.clone(),10,0xffffff);shake=Math.max(shake,.3);
 [ua,uv].forEach(u=>{u.pivot.rotation.set(0,0,0);u.fl.position.set(-.55,.95,.15);u.fr.position.set(.55,.95,.15);u.busy=false});
 A.position.y=V.position.y=0;
}

/* ---------- hra ---------- */
function xy(pl,p,k){if(p<0)return LAY.bases[pl][k];if(p<N)return LAY.track[(LAY.starts[pl]+p)%N];return LAY.lanes[pl][p-N]}
function legal(pl,r){const res=[];pos[pl].forEach((p,k)=>{let np;
 if(p<0){if(r!==6)return;np=0}else{np=p+r;if(np>N+3)return}
 if(pos[pl].includes(np))return;res.push(k)});return res}

const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FT={1:'',2:'rotateY(90deg)',3:'rotateX(90deg)',4:'rotateX(-90deg)',5:'rotateY(-90deg)',6:'rotateY(180deg)'};
const SHOW={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
let rolls=0;
function buildDice(){$('cube').innerHTML=[1,2,3,4,5,6].map(n=>`<div class="f" style="transform:${FT[n]} translateZ(42px)">${[...Array(9)].map((_,i)=>`<span class="${FACES[n].includes(i)?'o':''}"></span>`).join('')}</div>`).join('')}
function showDice(n){const [x,y]=SHOW[n];rolls++;$('cube').style.transform=`rotateX(${x+720*rolls}deg) rotateY(${y+720*rolls}deg)`}

function ui(msg){
 document.documentElement.style.setProperty('--pc',COL[turn]);
 $('players').innerHTML=NAMES.map((n,i)=>`<div class="card ${i===turn?'on':''}" style="--c:${COL[i]};margin-bottom:8px"><span class="dot"><img src="img/hrac${i+1}.jpg" alt="" onerror="this.remove()"></span><b>${n}</b>
 <span class="pips">${pos[i].map(p=>`<i class="${p>=N?'f':''}"></i>`).join('')}</span></div>`).join('');
 $('msg').textContent=msg||`Na řadě: ${NAMES[turn]}. Hoď kostkou.`;
 $('rollBtn').disabled=busy||phase!=='roll';
}

async function roll(){
 if(busy||phase!=='roll')return;busy=true;ui('Kostka se valí…');
 const d=$('dice');d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');
 const r=1+Math.floor(Math.random()*6);showDice(r);await sleep(1000);
 const m=legal(turn,r);
 if(!m.length){
  const allBase=pos[turn].every(p=>p<0);
  if(allBase&&tries<2){tries++;busy=false;ui(`Padlo ${r}. Zkus to znovu (pokus ${tries+1} ze 3).`);return}
  ui(`Padlo ${r}. Žádný tah, další hráč.`);await sleep(1100);next(false);return}
 tries=0;
 if(m.length===1){ui(`Padlo ${r}.`);await sleep(350);move(turn,m[0],r);return}
 phase='move';cur=m;busy=false;m.forEach(k=>setCan(els[turn][k],true));
 ui(`Padlo ${r}. Klikni na figurku, kterou chceš posunout.`);window._r=r;
}
function pick(pl,k){if(busy||phase!=='move'||pl!==turn||!cur.includes(k))return;move(pl,k,window._r)}

async function move(pl,k,r){
 busy=true;phase='anim';els[pl].forEach(e=>setCan(e,false));
 const o=els[pl][k];let prev=o.position.clone();
 if(pos[pl][k]<0){pos[pl][k]=0;prev=o.position.clone();await hop(o,W(xy(pl,0,k)),1.8,.5)}
 else for(let i=0;i<r;i++){prev=o.position.clone();pos[pl][k]++;await hop(o,W(xy(pl,pos[pl][k],k)))}
 const p=pos[pl][k];let hit=null;
 if(p<N){const cell=(LAY.starts[pl]+p)%N;
  for(let v=0;v<3&&hit===null;v++){if(v===pl)continue;pos[v].forEach((q,j)=>{if(hit===null&&q>=0&&q<N&&(LAY.starts[v]+q)%N===cell)hit=[v,j]})}}
 if(hit){ui(`${NAMES[pl]} se pere s ${NAMES[hit[0]]}! 💥`);await fight(pl,k,hit[0],hit[1],prev);pos[hit[0]][hit[1]]=-1;place(hit[0],hit[1]);ui()}
 if(pos[pl].every(q=>q>=N)){ui();for(let i=0;i<8;i++)setTimeout(()=>burst(new THREE.Vector3((Math.random()-.5)*14,2,(Math.random()-.5)*14),24,COL[pl].replace('#','0x')|0),i*250);
  $('winTxt').textContent=`${NAMES[pl]} vyhrává!`;$('win').classList.add('show');phase='end';return}
 next(r===6);
}
function next(extra){tries=0;cur=[];if(!extra)turn=(turn+1)%3;phase='roll';busy=false;
 ui(extra?`${NAMES[turn]} hází znovu – padla šestka!`:undefined)}

function buildMenu(){
 $('cards').innerHTML=LAYOUTS.map((q,i)=>`<button class="vc ${i===lay&&started?'on':''}" data-i="${i}"><svg viewBox="0 0 660 660">${q.track.map(([x,y],n)=>`<circle cx="${x}" cy="${y}" r="${Math.max(q.cr*1.9,30)}" fill="${q.starts.includes(n)?COL[q.starts.indexOf(n)]:'#b78cff'}"/>`).join('')}${q.lanes.map((l,i)=>l.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${Math.max(q.cr*1.5,24)}" fill="${COL[i]}" opacity=".65"/>`).join('')).join('')}<circle cx="330" cy="330" r="34" fill="#fff" opacity=".9"/></svg><b>${q.name}</b><small>${DESC[i]}</small></button>`).join('');
 [...$('cards').children].forEach(b=>b.onclick=()=>{lay=+b.dataset.i;try{localStorage.setItem('cnsLay',lay)}catch(e){}started=true;$('menu').classList.remove('show');init()});
 $('closeMenu').style.display=started?'':'none';
}
function openMenu(){buildMenu();$('win').classList.remove('show');$('menu').classList.add('show')}
function init(){
 LAY=LAYOUTS[lay];N=LAY.track.length;
 pos=[0,1,2].map(()=>[-1,-1,-1,-1]);turn=0;phase='roll';busy=false;tries=0;cur=[];
 $('win').classList.remove('show');loadBoardTex(drawBoard());makePieces();
 for(let pl=0;pl<3;pl++)for(let k=0;k<4;k++)place(pl,k);
 ui();
}
buildDice();showDice(1);
$('dice').onclick=roll;$('rollBtn').onclick=roll;
$('dice').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();roll()}};
$('newBtn').onclick=init;$('again').onclick=init;$('menuBtn').onclick=openMenu;$('toMenu').onclick=openMenu;$('closeMenu').onclick=()=>$('menu').classList.remove('show');
if(window.THREE){initGL();init();openMenu()}else $('msg').textContent='Nepodařilo se načíst 3D knihovnu (three.js). Zkontroluj připojení k internetu.';
</script>
